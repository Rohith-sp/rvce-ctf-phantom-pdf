<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Verification - RVCE Cyber Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(26, 35, 51, 0.85);
            --border-color: rgba(255, 255, 255, 0.15);
            --accent-cyan: #38bdf8;
            --accent-indigo: #818cf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg-dark) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }
        .gate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            text-align: center;
        }
        .icon { font-size: 3rem; margin-bottom: 1rem; }
        h2 { margin: 0 0 0.5rem 0; font-size: 1.6rem; color: #fff; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        .doc-info {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        .doc-info strong { display: block; font-size: 1.1rem; color: var(--accent-cyan); margin-bottom: 0.3rem; }
        .doc-info span { font-size: 0.85rem; color: var(--text-muted); }
        .question-box {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .question-box label { display: block; font-weight: 600; margin-bottom: 0.6rem; color: #fff; font-size: 1rem; }
        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
        button {
            width: 100%;
            padding: 1rem;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
        }
        .error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .back-link { display: inline-block; margin-top: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="gate-card">
        <div class="icon">🔒</div>
        <h2>Access Control Challenge</h2>
        <div class="subtitle">RVCE Cyber Labs Vault Security Gate</div>
        
        <div class="doc-info">
            <strong>{{ doc['title'] }}</strong>
            <span>Requested File: {{ doc['file'] }}</span>
        </div>

        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="question-box">
                <label>Security Verification Question:</label>
                <div style="color: var(--accent-cyan); margin-bottom: 0.8rem; font-size: 1.05rem;">
                    {{ doc['question'] }}
                </div>
                <input type="text" name="answer" placeholder="Enter password / answer..." required autofocus>
            </div>
            <button type="submit">Verify & Download Document ↗</button>
        </form>
        
        <a href="/" class="back-link">← Return to Document Repository</a>
    </div>
</body>
</html>
