<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Directory - RVCE Cyber Labs</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 0; }
        header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #38bdf8; }
        h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
        nav a { color: #cbd5e1; text-decoration: none; margin-left: 1.5rem; font-weight: 500; }
        nav a:hover { color: #38bdf8; }
        .container { max-width: 900px; margin: 3rem auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; border-top: 4px solid #0284c7; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        .card h3 { margin-top: 0; color: #f8fafc; font-size: 1.25rem; }
        .role { color: #38bdf8; font-weight: 600; font-size: 0.9rem; margin-bottom: 1rem; }
        .bio { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <h1>RVCE Cyber Labs Portal</h1>
        <nav>
            <a href="/">Home / Search</a>
            <a href="/team">Team Directory</a>
        </nav>
    </header>
    <div class="container">
        <h2>Our Security & Research Team</h2>
        <div class="grid">
            {% for member in members %}
            <div class="card">
                <h3>{{ member['name'] }}</h3>
                <div class="role">{{ member['role'] }}</div>
                <div class="bio">{{ member['bio'] }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
